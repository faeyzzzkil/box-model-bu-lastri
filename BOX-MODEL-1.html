<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    * {
        box-sizing: border-box;
    }

    .card {
        width: 300px;
        height: 150px;
        padding: 20px;
        border: 5px solid;
        margin: 30px ;
        background-color: rgb(238, 255, 0);
    }

    .card h2 {
        margin-top: 0;
    }

    .card p {
        margin-bottom: 0;
    }
   </style>
</head>
<body>
    <div class="card">
        <h2>Faeyza Zuljalali Rizki</h2>
        <p>Saya adalah seorang pelajar SMK kelas 10 yang bersekolah di SMK 5 Malang dan berada dijurusan RPL.</p>
    </div>
</body>
</html>
