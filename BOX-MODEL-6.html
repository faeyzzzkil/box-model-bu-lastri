<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            box-sizing: border-box;
        }

        .card {
            width: 300px; ;
            padding:20px;
            margin: 60px;
            border: 3px solid;
            border-radius: 15px;
            box-shadow: 0 5px 15px;
            background-color: darkslateblue;
        }

        .card img{
            width: auto;
            height: 100px;
            float: left;
            margin-right: 10px;
            border-radius: 15px;
        }

        .card h2{
            margin-top: 0;
            color: white;
        }

        .card h6{
            color: ivory;
        }

        .card p{
            color: aqua;
        }

        .card strong{
            color: white;
            font-size: 20px;
        }

        .card button{
            background-color: rgb(6, 194, 6);
            color: white;
            padding: 10px 20px;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sepeda Motor</h2>
        <hr>
        <h6>Yamaha All New Aerox 155 Connected (Varian Cyber City)</h6>
        <img src="img/motor.jpg" alt="sepeda motor">
        <p>sepeda motor matik sporty ini dirancang khusus untuk generasi muda dengan mesin bertenaga 155cc VVA, bodi aerodinamis yang agresif, serta fitur konektivitas smartphone untuk mobilitas harian di perkotaan.</p>
        <p><strong>Harga: 27.775.000</strong></p>
        <button>Beli Sekarang</button>
    </div>
</body>
</html>
