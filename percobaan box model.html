<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            box-sizing: border-box;
        }

        .card {
            width: 300px;
            padding: 20px;
            border: 3px solid black;
            margin: 30px auto;
            background-color: #f2f2f2;
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Belajar CSS</h2>
        <p>Ini adalah contoh penerapan Box Model.</p>
    </div>
</body>

</html>
